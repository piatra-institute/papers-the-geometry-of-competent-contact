- id: umwelt-bound
  kind: interpretation
  rationale: Limits the measure to the agent's hypothesis space; competence on different manifolds is
    not commensurable.
  passage: Competent contact is contact with the world as the agent represents it, and no agent-independent
    standpoint exists from which that contact could be scored against the world itself.
- id: scalar-discards
  kind: interpretation
  rationale: Generalizes from the proposition and the transfer example; holds wherever reward factors
    through a coarsening of the world.
  passage: A learner that maximizes a scalar faithful to its training task discards the structure that
    would support the next task, and it appears most efficient when it is least prepared for a new one.
