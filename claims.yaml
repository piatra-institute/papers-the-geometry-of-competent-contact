- id: competence-definition
  kind: definition
  rationale: Stipulates the three geometric measures of competence used throughout (entropy contraction,
    Fisher-Rao path length, terminal separation).
  passage: Competent contact is measured on that geometry by the contraction of uncertainty, the Fisher-Rao
    length of the belief trajectory, and the separation the terminal belief keeps between world-states.
- id: fisher-rao-choice
  kind: assumption
  rationale: Adopts the Fisher-Rao metric on the grounds of Chentsov's uniqueness theorem; the argument
    depends on invariance under sufficient statistics being the right requirement.
  passage: Any other measure of distance between beliefs would introduce structure the statistics does
    not contain, so belief space is equipped with the Fisher-Rao geometry.
- id: hand-specified-policies
  kind: assumption
  rationale: The two policies are constructions at a matched probe budget, not cost-optimal plans; the
