abstract: |-
  Reinforcement learning scores a policy by a single number, the expected return, and treats everything an agent does as a means to that scalar. Competent action resists the scalar: when a hand turns a cup to read its shape, what improves is not a running total but the agent's grip on the world, the way its uncertainty about hidden states collapses into task-relevant structure. This paper gives that grip a formal object. The agent's belief over world-states is a sufficient statistic for control, it lives on the probability simplex, and Chentsov's theorem forces the Fisher-Rao metric on that simplex, so the movement of belief has a geometry that is compelled rather than chosen. Competent contact is read off that geometry: the contraction of the uncertainty set, the Fisher-Rao length of the belief trajectory, and the separability the terminal belief keeps between world-states. The central result is a quotient. If reward depends on the world only through a partition, the expected return depends on the belief only through its pushforward onto classes, so two beliefs at the maximal Fisher-Rao distance can be reward-identical, and a scalar objective is blind to everything the geometry resolves within a reward-class. A small active-perception POMDP makes this exact. A reward-only policy and a competent-contact policy attain the identical single-task return, yet leave beliefs of very different shape, and world-states that differ only in a reward-irrelevant attribute collapse to Fisher-Rao distance zero under the reward-only policy while the competent policy holds them apart. The discarded geometry is exactly what transfers: on a second task the reward never mentioned, the reward-only agent scores at chance and the competent agent well above it, a gap no single-task return could have priced. A from-scratch curvature routine recovers the simplex curvature to machine precision, certifying the geometry the argument runs on.
