abstract: 'Reinforcement learning scores a policy by a single number, the expected return $J(\pi)=\mathbb{E}[R]$,
  and treats everything an agent does as a means to that scalar. In competent action, such as a hand turning
  a cup to read its shape or a robot tapping a surface to tell metal from plastic, what improves is the
  agent''s grip on the world: the way its uncertainty about hidden states collapses into task-relevant
  structure. The agent''s belief over world-states is a sufficient statistic for control and lies on the
  probability simplex, where Chentsov''s theorem singles out the Fisher-Rao metric, so the movement of
  belief has a determined geometry. Competent contact is measured on that geometry by the contraction
  of uncertainty, the Fisher-Rao length of the belief trajectory, and the separation the terminal belief
  keeps between world-states. If reward depends on the world only through a partition $g$, the expected
  return depends on the belief only through its pushforward $g_\ast b$, so two beliefs at the maximal
  Fisher-Rao distance $\pi$ can be reward-identical. In an exactly solvable active-perception POMDP, a
  reward-only policy and a competent-contact policy attain the same single-task return of 0.8 but leave
  terminal entropies of 1.09 and 0.68 nats; world-states differing only in the reward-irrelevant attribute
  collapse to Fisher-Rao distance 0.0 under the reward-only policy, while the competent policy keeps all
  six at least 2.44 apart. On a second task the first reward never mentioned, the reward-only agent scores
  at chance, 0.5, and the competent agent 0.85, a gap of 0.35 invisible to the single-task return.'
web_blurb: When reward depends on the world only through a partition, expected return sees belief only
  through its pushforward. In an exact POMDP, two policies with equal return 0.8 differ in Fisher-Rao
  belief geometry and in zero-shot transfer, 0.5 against 0.85.
